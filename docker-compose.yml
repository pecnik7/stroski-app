services:
  db:
    image: postgres:16
    container_name: stroski-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geslo123
      POSTGRES_DB: stroski_db
    ports:
      - "5432:5432"
    volumes:
      - stroski_data:/var/lib/postgresql/data

volumes:
  stroski_data: